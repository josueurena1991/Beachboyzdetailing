<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Beachboyz Detailing | The Miami Experience</title>

<meta name="description"

<style>

/* =========================================================
   RESET
========================================================= */

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  background: #020506;
  color: #fff;
  font-family: Arial, Helvetica, sans-serif;
  overflow-x: hidden;
}

a {
  color: inherit;
  text-decoration: none;
}

button {
  font: inherit;
}


/* =========================================================
   HEADER
========================================================= */

header {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  z-index: 1000;
  padding: 22px 5vw;
  display: flex;
  justify-content: space-between;
  align-items: center;
  transition: 0.35s ease;
}

header.scrolled {
  padding-top: 14px;
  padding-bottom: 14px;
  background: rgba(2, 6, 7, 0.9);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(255,255,255,0.06);
}

.logo {
  font-size: 20px;
  font-weight: 900;
  letter-spacing: 2px;
  white-space: nowrap;
}

.logo span {
  color: #56e0ff;
}

nav {
  display: flex;
  gap: 28px;
  align-items: center;
}

nav a {
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 1px;
  text-transform: uppercase;
  opacity: 0.82;
  transition: 0.25s ease;
}

nav a:hover {
  opacity: 1;
  color: #56e0ff;
}

.nav-phone {
  color: #56e0ff;
}

.menu {
  display: none;
  background: none;
  border: 0;
  color: #fff;
  font-size: 28px;
}


/* =========================================================
   CINEMATIC EXPERIENCE
========================================================= */

.experience {
  position: relative;
  height: 520vh;
}

.experience-stage {
  position: sticky;
  top: 0;
  height: 100vh;
  min-height: 650px;
  overflow: hidden;
  background: #030708;
  perspective: 1200px;
}


/* =========================================================
   SHOWROOM
========================================================= */

.showroom {
  position: absolute;
  inset: 0;
  overflow: hidden;
  transform-style: preserve-3d;
}

.back-wall {
  position: absolute;
  inset: -20%;
  background:
    radial-gradient(
      circle at 50% 42%,
      rgba(73,218,242,0.18),
      transparent 30%
    ),
    linear-gradient(
      90deg,
      rgba(255,255,255,0.025) 1px,
      transparent 1px
    ),
    linear-gradient(
      rgba(255,255,255,0.025) 1px,
      transparent 1px
    ),
    linear-gradient(
      145deg,
      #111b1e,
      #030708 65%
    );
  background-size:
    auto,
    110px 110px,
    110px 110px,
    auto;
  transform: translateZ(-700px) scale(2);
  will-change: transform;
}

.back-wall::after {
  content: "";
  position: absolute;
  inset: 0;
  background:
    linear-gradient(
      90deg,
      rgba(0,0,0,0.8),
      transparent 30%,
      transparent 70%,
      rgba(0,0,0,0.8)
    );
}

.ceiling {
  position: absolute;
  top: -42%;
  left: -10%;
  width: 120%;
  height: 75%;
  background:
    repeating-linear-gradient(
      90deg,
      rgba(255,255,255,0.04) 0 2px,
      transparent 2px 100px
    ),
    linear-gradient(
      #182225,
      #071012
    );
  transform:
    rotateX(67deg)
    translateZ(-260px);
  transform-origin: center bottom;
  will-change: transform;
}

.floor {
  position: absolute;
  left: -30%;
  bottom: -50%;
  width: 160%;
  height: 100%;
  background:
    radial-gradient(
      ellipse at center,

      90deg,
      rgba(255,255,255,0.04) 0 1px,
      transparent 1px 95px
    ),
    repeating-linear-gradient(
      0deg,
      rgba(255,255,255,0.03) 0 1px,
      transparent 1px 95px
    ),
    #071012;
  transform:
    perspective(900px)
    rotateX(68deg)
    translateZ(-100px)
    scale(1.1);
  transform-origin: center top;
  will-change: transform;
}

.floor-glow {
  position: absolute;
  left: 50%;
  bottom: 12%;
  width: 60vw;
  height: 15vw;
  transform: translateX(-50%);
  background: radial-gradient(
    ellipse,
    rgba(68,221,246,0.2),
    transparent 70%
  );
  filter: blur(18px);
}

.column {
  position: absolute;
  top: -10%;
  width: 35px;
  height: 125%;
  background: linear-gradient(
    90deg,
    #030607,
    #1b292d,
    #05090a
  );
  box-shadow: 0 0 30px rgba(75,220,245,0.08);
}

.column.left {
  left: 8%;
  transform: rotate(-5deg) translateZ(-150px);
}

.column.right {
  right: 8%;
  transform: rotate(5deg) translateZ(-150px);
}

   SHOWROOM LIGHTS
========================================================= */

.shop-light {

  width: 380px;
  max-width: 38vw;
  background: #dfffff;
  box-shadow:
    0 0 12px #a6f3ff,
    0 0 35px rgba(82,220,245,0.7);
  opacity: 0.75;
  will-change: transform;
}

.shop-light.a {
  top: 15%;

  transform: rotate(-7deg) translateZ(-250px);
}

.shop-light.b {
  top: 20%;
  right: -5%;
  transform: rotate(7deg) translateZ(-300px);
}

.shop-light.c {
  top: 9%;

}


/* =========================================================
   CAR PLATFORM
========================================================= */

.platform {
  position: absolute;
  left: 50%;
  top: 57%;
  width: min(780px, 90vw);
  height: 190px;
  transform:
    translate(-50%, -50%)
    rotateX(68deg)
    translateZ(-10px);
  border-radius: 50%;
  background:
    radial-gradient(
      ellipse,
      rgba(72,222,246,0.24),
      rgba(0,0,0,0.1) 55%,
      transparent 70%
    );
  filter: blur(2px);
}


/* =========================================================
   CAR
========================================================= */

.car-scene {
  position: absolute;
  left: 50%;
  top: 50%;
  width: min(760px, 86vw);
  transform-style: preserve-3d;
  transform:
    translate(-50%, -50%)
    translateZ(130px);
  z-index: 20;
  will-change: transform;
}

.car-photo {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 16px;
  box-shadow:
    0 55px 100px rgba(0,0,0,0.8),
    0 0 65px rgba(61,213,239,0.12);
  transition: filter 0.4s ease;
}

   CAR LIGHT
========================================================= */

  height: 7%;
  border-radius: 50%;
  background: rgba(213,249,255,0.75);
  filter: blur(10px);
  mix-blend-mode: screen;
  pointer-events: none;
}

.car-light.left {
  left: 17%;
}

.car-light.right {
  right: 17%;
}


/* =========================================================
   FOAM EFFECT
========================================================= */

.foam {
  position: absolute;
  inset: 2%;
  border-radius: 18px;
  opacity: 0;
  z-index: 5;
  pointer-events: none;
  background:
    radial-gradient(circle at 15% 30%, rgba(255,255,255,0.9) 0 4%, transparent 5%),
    radial-gradient(circle at 32% 55%, rgba(255,255,255,0.95) 0 7%, transparent 8%),
    radial-gradient(circle at 58% 32%, rgba(255,255,255,0.92) 0 6%, transparent 7%),

  transform: translateY(-25%);
  will-change: transform, opacity;
}


/* =========================================================
   WATER
========================================================= */

.water {
  position: absolute;
  inset: -20%;
  opacity: 0;
  pointer-events: none;
  z-index: 30;
  background:
    repeating-linear-gradient(
      105deg,
      transparent 0 45px,
      rgba(184,246,255,0.3) 46px 48px,
      transparent 49px 90px
    );
  transform: translateX(-35%) rotate(-8deg);
  mix-blend-mode: screen;
  will-change: transform, opacity;
}


/* =========================================================
   POLISHER LIGHT
========================================================= */

.polish-light {
  position: absolute;
  top: -30%;
  left: -40%;
  width: 30%;
  height: 180%;
  background: linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,0.45),
    rgba(106,235,255,0.25),
    transparent
  );
  transform: rotate(18deg);
  opacity: 0;
  z-index: 35;
  pointer-events: none;
  filter: blur(5px);
  will-change: transform, opacity;
}


/* =========================================================
   CERAMIC SHINE
========================================================= */

.ceramic-shine {
  position: absolute;
  inset: 0;
  border-radius: 16px;
  z-index: 25;
  pointer-events: none;
  opacity: 0;
  background:
    linear-gradient(
      115deg,
      transparent 20%,
      rgba(255,255,255,0.22) 42%,
      rgba(89,228,255,0.3) 50%,
      transparent 65%
    );
  transform: translateX(-100%);
  will-change: transform, opacity;
}
